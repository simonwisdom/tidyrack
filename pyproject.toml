[project]
name = "tidyrack"
version = "0.1.0"
description = "Photograph clothes one at a time; get a clean cutout and guessed details; browse your wardrobe."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "rembg[cpu]>=2.0.59",
    "segno>=1.6",
    "curl-cffi>=0.16.3",
    "numpy>=2",
    "cryptography>=50.0.2",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
